name: Core side state bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bridge:
    if: ${{ !contains(github.event.head_commit.message, '[core-side-bridge]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/bridge-core-side-state.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/buffet-ui.js public/buffet-app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add explicit core-to-Buffet state bridge [core-side-bridge]'
          git push
