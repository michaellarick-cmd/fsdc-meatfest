name: One-time app initialization cleanup

on:
  push:
    branches: [cleanup-app-init]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove premature calculation call
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text().rstrip()
          if not s.endswith('calc();'):
              raise SystemExit('Expected final calc(); call was not found')
          p.write_text(s[:-7].rstrip()+'\n')
          PY
      - name: Test
        run: npm test
      - name: Commit source cleanup and remove this workflow
        run: |
          rm .github/workflows/cleanup-app-init.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js .github/workflows/cleanup-app-init.yml
          git commit -m "Fix application initialization order"
          git push
