name: One-time architecture cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[architecture-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup scripts
        run: |
          python cleanup_architecture.py
          python cleanup_engine_tests.py
          python cleanup_docs.py
          rm -f public/side-engine.js public/side-cleanup.js
      - name: Verify
        run: npm test
      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public worker.js test docs
          git rm --cached cleanup_architecture.py cleanup_engine_tests.py cleanup_docs.py 2>/dev/null || true
          git add -u
          git commit -m "Clean production architecture [architecture-cleanup]"
          git push
