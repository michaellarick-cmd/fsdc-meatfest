name: One-time index cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Clean index architecture') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline application
        run: node scripts/extract-inline.mjs
      - name: Validate extracted files
        run: |
          node --check public/app.js
          ! grep -q '<script>' public/index.html
          ! grep -q 'function calc(' public/index.html
          ! grep -q 'function buildSummary(' public/index.html
          ! grep -q 'function multiplier(' public/index.html
      - name: Commit clean architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/app.js
          git rm -f scripts/extract-inline.mjs .github/workflows/cleanup-index.yml
          git commit -m "Clean index architecture"
          git push
