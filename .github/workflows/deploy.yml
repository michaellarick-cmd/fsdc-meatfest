name: Deploy Meatfest to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  MEATFEST_LIVE_URL: https://fsdc-meatfest.michael-larick.workers.dev/
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch buffet interaction path
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/buffet-ui.js';
          let s = fs.readFileSync(path, 'utf8');
          const oldState = "const state = { supplementalIds: [], dessertIds: [], breadIds: [], condimentIds: [], dessertLoad: 'moderate', sausageMode: 'polish' };";
          const newState = "const state = window.__meatfestBuffetState || (window.__meatfestBuffetState = { supplementalIds: [], dessertIds: [], breadIds: [], condimentIds: [], dessertLoad: 'moderate', sausageMode: 'polish' });";
          if (!s.includes(oldState)) throw new Error('Expected buffet state declaration not found');
          s = s.replace(oldState, newState);
          const oldPlan = "const p=B.plan({proteinKeys,sideIds,sideRows:s.sideRows,eaters:s.eaters,breadIds:state.breadIds,supplementalIds:state.supplementalIds,condimentIds:state.condimentIds,dessertIds:state.dessertIds,load:state.dessertLoad,sausageMode:state.sausageMode});";
          const newPlan = "const p=B.plan({proteinKeys,sideIds,sideRows:s.sideRows,eaters:s.eaters,breadIds:state.breadIds,supplementalIds:state.supplementalIds,condimentIds:state.condimentIds,dessertIds:state.dessertIds,load:state.dessertLoad,sausageMode:state.sausageMode});";
          if (!s.includes(oldPlan)) throw new Error('Expected buffet plan call not found');
          fs.writeFileSync(path, s);
          NODE

      - name: Run Meatfest calculation tests
        run: npm test

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit wrangler@4.129.1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy

      - name: Install browser test runner
        run: npm install --no-save --no-audit playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed Cloudflare site
        run: node test/cloudflare-live.test.cjs

      - name: Verify buffet interaction performance
        run: node test/buffet-interaction-performance.test.cjs
