name: Deploy Meatfest to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MEATFEST_LIVE_URL: https://fsdc-meatfest.michael-larick.workers.dev/
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch buffet interaction handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/buffet-ui.js')
          s=p.read_text()
          old="""  function wireButton(btn){btn.onclick=e=>{e.preventDefault();e.stopPropagation();const key=btn.dataset.buffetKey,id=btn.dataset.buffetId,arr=state[key];if(!Array.isArray(arr)||btn.disabled)return;state[key]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];render()}}\n  function wireChoiceButtons(card){card.querySelectorAll('[data-buffet-key]').forEach(wireButton)}\n"""
          new="""  let renderTimer=0;\n  function scheduleRender(){if(renderTimer)return;renderTimer=setTimeout(()=>{renderTimer=0;render()},120)}\n  function wireButton(btn){btn.onclick=e=>{e.preventDefault();e.stopPropagation();const key=btn.dataset.buffetKey,id=btn.dataset.buffetId,arr=state[key];if(!Array.isArray(arr)||btn.disabled)return;state[key]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];const on=state[key].includes(id);btn.classList.toggle('on',on);btn.setAttribute('aria-pressed',String(on));const check=btn.querySelector('.buffetCheck');if(check)check.textContent=on?'✓':'';scheduleRender()}}\n  function wireChoiceButtons(card){card.querySelectorAll('[data-buffet-key]').forEach(wireButton)}\n"""
          if old not in s: raise SystemExit('wireButton patch target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Commit responsive buffet correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/buffet-ui.js
          if git diff --cached --quiet; then echo 'Buffet interaction correction already present.'; else git commit -m 'fix: make buffet selections responsive'; git push; fi

      - name: Run Meatfest calculation tests
        run: npm test

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit wrangler@4.129.1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy

      - name: Install browser test runner
        run: npm install --no-save --no-audit playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed Cloudflare site
        run: node test/cloudflare-live.test.cjs

      - name: Verify buffet interaction performance
        run: node test/buffet-interaction-performance.test.cjs
