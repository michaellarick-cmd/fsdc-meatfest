name: Deploy Meatfest to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MEATFEST_LIVE_URL: https://fsdc-meatfest.michael-larick.workers.dev/
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply controlled UI correction and restore workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/buffet-ui.js')
          s=p.read_text()
          old="const state = { supplementalIds: [], dessertIds: [], breadIds: [], condimentIds: ['bbqSauce','pickles','mustard'], dessertLoad: 'moderate', sausageMode: 'polish' };"
          new="const state = { supplementalIds: [], dessertIds: [], breadIds: [], condimentIds: [], dessertLoad: 'moderate', sausageMode: 'polish' };"
          if old not in s: raise SystemExit('Expected condiment state initializer not found')
          s=s.replace(old,new,1)
          old_render="function render(){ensureStyle();state.breadIds=accompanimentBreadIds();const s=window.buildSummary(),proteinKeys=s.rows.map(r=>r.key),sideIds=s.sideRows.map(r=>r.id);"
          new_render="function render(){if(typeof planningMode!=='undefined'&&planningMode==='family'){document.getElementById('buffetServiceCard')?.remove();document.getElementById('buffetLayoutCard')?.remove();return}ensureStyle();state.breadIds=accompanimentBreadIds();const s=window.buildSummary(),proteinKeys=s.rows.map(r=>r.key),sideIds=s.sideRows.map(r=>r.id);if(!proteinKeys.length&&!sideIds.length){state.supplementalIds=[];state.dessertIds=[];state.condimentIds=[];state.dessertLoad='moderate';state.sausageMode='polish';}"
          if old_render not in s: raise SystemExit('Expected buffet render entry point not found')
          s=s.replace(old_render,new_render,1)
          p.write_text(s)
          PY
          cat > .github/workflows/deploy.yml <<'EOF'
          name: Deploy Meatfest to Cloudflare

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          env:
            MEATFEST_LIVE_URL: https://fsdc-meatfest.michael-larick.workers.dev/
            GIT_CONFIG_COUNT: "1"
            GIT_CONFIG_KEY_0: init.defaultBranch
            GIT_CONFIG_VALUE_0: main

          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Run Meatfest calculation tests
                  run: npm test

                - name: Install pinned Wrangler
                  run: npm install --no-save --no-audit wrangler@4.129.1

                - name: Deploy to Cloudflare Workers
                  uses: cloudflare/wrangler-action@v4
                  with:
                    apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                    wranglerVersion: "4.129.1"
                    command: deploy

                - name: Install browser test runner
                  run: npm install --no-save --no-audit playwright@1.63.0

                - name: Install Chromium
                  run: npx playwright install --with-deps chromium

                - name: Verify deployed Cloudflare site
                  run: node test/cloudflare-live.test.cjs
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/buffet-ui.js .github/workflows/deploy.yml
          git commit -m "fix: correct buffet defaults and family mode"
          git push

      - name: Run Meatfest calculation tests
        run: npm test

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit wrangler@4.129.1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy

      - name: Install browser test runner
        run: npm install --no-save --no-audit playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed Cloudflare site
        run: node test/cloudflare-live.test.cjs

      - name: Verify requested UI corrections live
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.goto(process.env.MEATFEST_LIVE_URL,{waitUntil:'networkidle'});
            const buffetCards=()=>p.locator('#buffetServiceCard,#buffetLayoutCard').count();
            if(await buffetCards()!==2) throw new Error('Buffet sections are not present in Meatfest mode');
            const condTexts=['BBQ Sauce','Pickles','Mustard'];
            for(const t of condTexts){const btn=p.getByRole('button',{name:new RegExp('^'+t+'$','i')});if(await btn.count()!==1)throw new Error(`Missing condiment control: ${t}`);if(await btn.getAttribute('aria-pressed')==='true')throw new Error(`Condiment incorrectly selected by default: ${t}`);await btn.click();}
            for(const t of condTexts){const btn=p.getByRole('button',{name:new RegExp('^'+t+'$','i')});if(await btn.getAttribute('aria-pressed')!=='true')throw new Error(`Condiment did not select: ${t}`);}
            const reset=p.getByRole('button',{name:/reset/i});if(await reset.count()!==1)throw new Error('Reset control not found');await reset.click();await p.waitForTimeout(150);
            for(const t of condTexts){const btn=p.getByRole('button',{name:new RegExp('^'+t+'$','i')});if(await btn.getAttribute('aria-pressed')==='true')throw new Error(`Reset failed to clear condiment: ${t}`);}
            const family=p.getByRole('button',{name:/family/i});if(await family.count()!==1)throw new Error('Family Mode control not found');await family.click();await p.waitForTimeout(150);
            if(await buffetCards()!==0)throw new Error('Sections 6 and 7 are still rendered in Family Mode');
            console.log('Requested buffet UI corrections: PASS');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
