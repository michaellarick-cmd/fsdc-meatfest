name: Deploy Meatfest to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MEATFEST_LIVE_URL: https://fsdc-meatfest.michael-larick.workers.dev/
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Correct buffet tin fill semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine = Path('public/buffet-engine.js')
          s = engine.read_text()
          old = "serviceFill:entry.fill||'quarter'"
          new = "serviceFill:'partial',fillFraction:entry.fill"
          if old in s:
              s = s.replace(old, new)
          else:
              raise SystemExit('Expected buffet-engine tin fill expression not found')
          engine.write_text(s)

          ui = Path('public/buffet-ui.js')
          s = ui.read_text()
          old = "if(r===1)parts.push('¼ tin');if(r===2)parts.push('½ tin');if(r===3)parts.push('¾ tin')"
          new = "if(r===1)parts.push('1 tin filled ¼ full');if(r===2)parts.push('1 tin filled ½ full');if(r===3)parts.push('1 tin filled ¾ full')"
          if old in s:
              s = s.replace(old, new)
          else:
              raise SystemExit('Expected buffet-ui tin wording not found')
          ui.write_text(s)
          PY

      - name: Commit buffet terminology correction
        run: |
          if git diff --quiet; then
            echo "No buffet terminology changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/buffet-engine.js public/buffet-ui.js
            git commit -m "Correct buffet tin fill terminology"
            git push
          fi

      - name: Run Meatfest calculation tests
        run: npm test

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit wrangler@4.129.1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy

      - name: Install browser test runner
        run: npm install --no-save --no-audit playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify deployed Cloudflare site
        run: node test/cloudflare-live.test.cjs
