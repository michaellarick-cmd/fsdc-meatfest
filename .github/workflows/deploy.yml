name: Deploy Meatfest to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MEATFEST_LIVE_URL: https://fsdc-meatfest.michael-larick.workers.dev/
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply controlled UI correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/buffet-ui.js')
          s=p.read_text()
          old="if(window.getPlanningMode?.()==='family'){document.getElementById('buffetServiceCard')?.remove();document.getElementById('buffetLayoutCard')?.remove();return}"
          new="if(document.querySelector('.modeBtn.active')?.textContent.trim().toLowerCase()==='family'){document.getElementById('buffetServiceCard')?.remove();document.getElementById('buffetLayoutCard')?.remove();return}"
          if old in s:
            s=s.replace(old,new,1)
            p.write_text(s)
          else:
            print('Buffet mode gate already uses initialized active mode control; no buffet source change needed.')
          PY

      - name: Run Meatfest calculation tests
        run: npm test

      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit wrangler@4.129.1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: deploy

      - name: Install browser test runner
        run: npm install --no-save --no-audit playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagnose live buffet mode
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.goto(process.env.MEATFEST_LIVE_URL,{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(2000);
            console.log('ACTIVE MODE:',await p.locator('.modeBtn.active').allTextContents());
            console.log('MODE SWITCH CLASS:',await p.locator('.modeSwitch').getAttribute('class'));
            console.log('BUFFET SERVICE:',await p.locator('#buffetServiceCard').count());
            console.log('BUFFET LAYOUT:',await p.locator('#buffetLayoutCard').count());
            console.log('BUFFET UI SCRIPT:',await p.locator('script[src*="buffet-ui"]').count());
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify requested UI corrections live
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage();
            await p.goto(process.env.MEATFEST_LIVE_URL,{waitUntil:'domcontentloaded'});await p.waitForTimeout(2000);
            const buffetCards=()=>p.locator('#buffetServiceCard,#buffetLayoutCard').count();
            if(await buffetCards()!==2) throw new Error('Buffet sections are not present in Meatfest mode');
            const condTexts=['BBQ Sauce','Pickles','Mustard'];
            for(const t of condTexts){const btn=p.getByRole('button',{name:new RegExp('^'+t+'$','i')});if(await btn.count()!==1)throw new Error(`Missing condiment control: ${t}`);if(await btn.getAttribute('aria-pressed')==='true')throw new Error(`Condiment incorrectly selected by default: ${t}`);await btn.click();}
            const reset=p.getByRole('button',{name:/reset/i});if(await reset.count()!==1)throw new Error('Reset control not found');await reset.click();await p.waitForTimeout(150);
            for(const t of condTexts){const btn=p.getByRole('button',{name:new RegExp('^'+t+'$','i')});if(await btn.getAttribute('aria-pressed')==='true')throw new Error(`Reset failed to clear condiment: ${t}`);}
            const family=p.getByRole('button',{name:/family/i});if(await family.count()!==1)throw new Error('Family Mode control not found');await family.click();await p.waitForTimeout(300);
            if(await buffetCards()!==0)throw new Error('Sections 6 and 7 are still rendered in Family Mode');
            console.log('Requested buffet UI corrections: PASS');
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
