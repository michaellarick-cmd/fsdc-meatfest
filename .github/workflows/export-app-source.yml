name: Canonical Side Refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'refactor: canonical side planner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Apply canonical side planner refactor
        shell: python
        run: |
          from pathlib import Path
          import re
          app=Path('public/app.js')
          s=app.read_text()
          pattern=r'function sideQty\(id\)\{.*?\n?function sideBuyText'
          replacement='''function familySideQty(id){const s=sides[id],[adults,kids]=activeTotals(),eaters=adults+kids*.5;if(!eaters)return 0;const p=sideProteinFactor(selected.size),n=Math.max(1,[...selectedSides].filter(x=>sides[x].group==="main").length),v=sideVarietyFactor(n);let q=s.base*(eaters/47)*p*(1+(v-1)*s.sensitivity);q*=1.125;if(id==="kraut"&&selected.has("brats"))q*=1.15;if(id==="corn"&&selected.size>=4)q*=.9;if(id==="rolls"){const sp=(selected.has("pork")?1:0)+(selected.has("chicken")?1:0)+(selected.has("brisket")?1:0);q*=sp?.65+.12*Math.min(3,sp):.35}if(id==="cornbread")q*=selected.size?1+.06*Math.min(4,selected.size):0;q=Math.max(s.min,q);if(s.unit==="tin")return roundNearest(q,s.round);if(s.unit==="recipe")return roundUpTo(q,s.round);if(s.unit==="ear")return Math.max(4,roundUpTo(q,2));return Math.max(s.min,roundUpTo(q,s.round))}
function sideQty(id){if(planningMode!=="meatfest"||!window.BuffetEngine)return familySideQty(id);const [adults,kids]=activeTotals(),eaters=adults+kids*.5;if(!eaters)return 0;const proteinKeys=[...selected],sideIds=[...selectedSides].filter(x=>{const c=window.BuffetEngine.SIDE_ID_ALIASES?.[x]||x;return !!window.BuffetEngine.SIDES?.[c]}),breadMap={rolls:"hawaiian",cornbread:"cornbread"};const breadId=breadMap[id];if(breadId){const plan=window.BuffetEngine.breadPlan({breadIds:[breadId],proteinKeys,eaters});return plan.find(x=>x.id===breadId)?.quantity?.pieces||0}return window.BuffetEngine.menuSideQuantity(id,eaters,sideIds,proteinKeys)?.amount||0}
function sideBuyText'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('sideQty refactor target not found')
          app.write_text(s2)
      - name: Replace side planner regression test with canonical source-of-truth test
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data=''
          Path('test/sides.test.js').write_bytes(base64.b64decode(data))
          PY
      - name: Run regression tests
        run: npm test
      - name: Commit canonical refactor and remove migration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js test/sides.test.js
          git rm .github/workflows/export-app-source.yml tmp/canonical-refactor-source.txt tmp/refactor-note.txt
          git commit -m "refactor: canonical side planner"
          git push
