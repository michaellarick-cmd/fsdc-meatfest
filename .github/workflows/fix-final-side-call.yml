name: Fix final side call
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[final-side]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix-final-side-call.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/meatfest-final.js
          git diff --cached --quiet && exit 0
          git commit -m 'Remove final-layer side renderer dependency [final-side]'
          git push
