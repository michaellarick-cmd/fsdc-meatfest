name: Refine core side bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[refined-core-side]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/refine-core-side-bridge.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/buffet-ui.js public/buffet-app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use explicit bread state in core side bridge [refined-core-side]'
          git push
