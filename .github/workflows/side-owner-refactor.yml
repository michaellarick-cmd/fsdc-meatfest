name: Side owner refactor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[side-owner]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source refactor
        run: python3 tools/remove-duplicate-side-renderer.py
      - name: Commit source refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js test/buffet-ui-architecture.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make side-card renderer single-owner [side-owner]'
          git push
