name: Step 4 correction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'step4 presentation correction') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch buffet presentation plan
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('public/buffet-layout.js')
          s=p.read_text()

          old="""  function refillText(x){const q=x?.quantity||x?.side?.quantity||x?.bread?.quantity;return q?'Present service vessel(s) as planned; keep remaining production as backup and refill before the vessel is empty.':'Refill from the locked menu quantity; do not change the buy/yield plan.';}"""
          new=old+"""
          function presentationPlan(x){
            const q=x?.quantity||x?.side?.quantity||x?.bread?.quantity,behavior=q?.behavior||x?.behavior||null;
            const factor=Number(behavior?.initialPortion);
            if(q&&Number.isFinite(factor)&&factor>0&&factor<1){
              const pct=Math.round(factor*100),initial=Math.max(0,Number(q.amount)||0)*factor,backup=Math.max(0,(Number(q.amount)||0)-initial);
              return{initialFactor:factor,initial:`Start with ${pct}% of planned production`,backup:backup>0?`Hold ${Math.round(backup*100)/100} ${q.unit||'units'} as backup`:'No production remains in backup',trigger:'Refill when the service vessel reaches about 25% remaining.'};
            }
            if(q&&q.amount!=null){
              const unit=q.unit||'units',amount=Number(q.amount)||0;
              return{initialFactor:null,initial:'Start with 1 service vessel',backup:`Hold remaining ${amount} ${unit} as backup`,trigger:'Refill before the service vessel is empty.'};
            }
            return{initialFactor:null,initial:'Set out the planned service vessel',backup:'Hold remaining production as backup',trigger:'Refill before the service vessel is empty.'};
          }"""
          if old not in s: raise SystemExit('refillText anchor not found')
          s=s.replace(old,new,1)

          old="""return{id:x.id||x.name,name:itemName(x),station:g.station,vessel:x.vessel?.label||x.vessel?.type||'',service:serviceText(x),production:productionText(x),quantity:quantityText(x),refill:refillText(x),width:w,startIn:start,endIn:offset,position:`${start}\\\"–${offset}\\\" from table start`};"""
          new="""const presentation=presentationPlan(x);return{id:x.id||x.name,name:itemName(x),station:g.station,vessel:x.vessel?.label||x.vessel?.type||'',service:serviceText(x),production:productionText(x),quantity:quantityText(x),refill:refillText(x),initial:presentation.initial,backup:presentation.backup,refillTrigger:presentation.trigger,width:w,startIn:start,endIn:offset,position:`${start}\\\"–${offset}\\\" from table start`};"""
          if old not in s: raise SystemExit('stationPlan item anchor not found')
          s=s.replace(old,new,1)

          old="""<div class=\"mf-execution-note\"><b>Operating rule:</b> buy/production quantity stays locked. The service plan controls what is presented at the buffet, what vessel it occupies, where it sits in the sequence, and when the backup quantity is brought forward.</div>`;card.appendChild(box);}"""
          new="""<div class=\"mf-execution-note\"><b>Operating rule:</b> buy/production quantity stays locked. The service plan controls what is presented at the buffet, what vessel it occupies, where it sits in the sequence, and when the backup quantity is brought forward.</div><div class=\"mf-physical-table\"><div class=\"mf-physical-title\"><b>INITIAL PRESENTATION / BACKUP</b><span>Use the locked production quantity — do not add or remove food.</span></div><div class=\"mf-position-list\">${rows.map(r=>`<div class=\"mf-position-item\"><strong>${esc(r.name)}</strong><small>INITIAL: ${esc(r.initial)} • BACKUP: ${esc(r.backup)} • REFILL: ${esc(r.refillTrigger)}</small></div>`).join('')}</div></div>`;card.appendChild(box);}"""
          if old not in s: raise SystemExit('execution note anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)

          t=Path('test/cloudflare-live.test.cjs')
          ts=t.read_text()
          old="""return {...state,executionText,executionVisible:!!execution,executionRows:execution?[...execution.querySelectorAll('.mf-exec-row')].length-1:0};"""
          if old not in ts:
            old="""return {...state,executionText,executionVisible:!!execution,executionRows:execution?[...execution.querySelectorAll('.mf-exec-row')].length-1:0};"""
          # Re-query the live execution block after populatePrint() and expose presentation text.
          marker="""window.populatePrint?.();\n  const execution=document.querySelector('#buffetLayoutCard .mf-execution'),"""
          repl="""window.populatePrint?.();\n  const execution=document.querySelector('#buffetLayoutCard .mf-execution'),\n        presentationText=execution?.textContent||'',"""
          if marker not in ts: raise SystemExit('test execution anchor not found')
          ts=ts.replace(marker,repl,1)
          marker2="""if(state.executionRows<3)\n  fail(`Live buffet execution plan has too few service rows: ${state.executionRows}`);"""
          repl2=marker2+"""\nif(!state.presentationText?.includes('INITIAL PRESENTATION / BACKUP'))fail('Live buffet plan is missing initial presentation / backup section.');\nfor(const label of ['INITIAL:','BACKUP:','REFILL:']) if(!state.presentationText.includes(label))fail(`Live buffet plan is missing presentation field: ${label}`);"""
          if marker2 not in ts: raise SystemExit('test assertion anchor not found')
          ts=ts.replace(marker2,repl2,1)
          t.write_text(ts)
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/buffet-layout.js test/cloudflare-live.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: step4 presentation correction"
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          rm -f .github/workflows/step4-correction.yml
          git add .github/workflows/step4-correction.yml
          git commit -m "chore: remove step4 correction workflow"
          git push
