name: One-time brisket source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix source and clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/meatfest-final.js')
          s = p.read_text()
          old = '''      } else if (choiceId === "packer") {
        buy = `BUY 1 packer (~${MeatEngine.round1(row.buyWeight)} lb; ask for a 19–20 lb packer)`;
        note = "Meatfest anchor: one practical whole packer; do not split a 19–20 lb requirement into multiple small packers.";'''
          new = '''      } else if (choiceId === "packer") {
        const askLb = Math.max(14, Math.round(row.buyWeight));
        buy = `BUY 1 whole packer (~${MeatEngine.round1(row.buyWeight)} lb; ask for a packer around ${askLb} lb)`;
        note = "Meatfest anchor: one practical whole packer sized to the calculated requirement; do not split the requirement into multiple small packers.";'''
          if old not in s:
              raise SystemExit('Expected brisket block not found; refusing to modify code.')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F 'const askLb = Math.max(14, Math.round(row.buyWeight));' public/meatfest-final.js
          ! grep -F '19–20 lb packer' public/meatfest-final.js
          rm -f .github/workflows/tmp-brisket-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix dynamic brisket purchase guidance'
          git push
          gh workflow run deploy.yml --ref main
